context:
  version: "0.1.8"

package:
  name: pixi-install-to-prefix
  version: ${{ version }}

source:
  url: https://github.com/pavelzw/pixi-install-to-prefix/archive/v${{ version }}.tar.gz
  sha256: 9df236927ef2911afd25364797d714d07201d604b683179a79f1c9e47492b5f6

build:
  number: 0
  script:
    env:
      # Use cmake to build aws-lc-sys, because conda's CFLAGS inject -O2 which
      # overrides the -O0 required by jitterentropy-base.c, causing a build failure.
      AWS_LC_SYS_CMAKE_BUILDER: "1"
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - if: linux
        then:
          - export OPENSSL_DIR=$PREFIX
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
        else:
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - cmake
    - make
  host:
    - if: linux
      then:
        - openssl

tests:
  - script:
      - pixi-install-to-prefix --help

about:
  homepage: https://github.com/pavelzw/pixi-install-to-prefix
  summary: Install pixi environments to an arbitrary prefix
  description: |
    Pixi installs your environments to `.pixi/envs/<env-name>` by default. If you want to install your environment to an arbitrary location on your system, you can use `pixi-install-to-prefix`.
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/pavelzw/pixi-install-to-prefix

extra:
  recipe-maintainers:
    - pavelzw
    - ytausch
